spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: allobank-split-bill

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:4110}

app:
  github-username: ${GITHUB_USERNAME}
