services:
  postgres:
    image: postgres:16-alpine
    container_name: allobank-split-bill-db

    environment:
      POSTGRES_DB: allobank_split_bill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allobank_split_bill"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: allobank-split-bill-app

    ports:
      - "4110:4110"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/allobank_split_bill
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      GITHUB_USERNAME: ilhamhafizha

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: